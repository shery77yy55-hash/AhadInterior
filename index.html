<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ahad Interior | Wallpapers, Flooring, Curtains, Blinds & Wall Panelling</title>

  <meta
    name="description"
    content="Ahad Interior offers wallpapers, wooden flooring, vinyl flooring, curtains, blinds, sofa poshish and wall panelling for beautiful interior spaces. Contact us today."
  >

  <meta name="theme-color" content="#25211d">

  <!-- Open Graph -->
  <meta property="og:title" content="Ahad Interior">
  <meta
    property="og:description"
    content="Premium wallpapers, flooring, curtains, blinds, sofa poshish and wall panelling."
  >
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       AHAD INTERIOR
       SINGLE FILE WEBSITE
       HTML + CSS + JAVASCRIPT
       ========================================================= */

    :root {
      --ivory: #f8f5ef;
      --cream: #eee8dc;
      --beige: #d9cbb8;
      --taupe: #a89986;
      --brown: #725d48;
      --dark: #27231f;
      --charcoal: #34302c;
      --white: #ffffff;
      --border: rgba(39, 35, 31, 0.12);

      --heading-font: "Playfair Display", Georgia, serif;
      --body-font: "DM Sans", Arial, sans-serif;

      --container: 1180px;
      --radius: 18px;

      --shadow: 0 20px 50px rgba(39, 35, 31, 0.10);
      --shadow-small: 0 10px 30px rgba(39, 35, 31, 0.08);

      --transition: 0.35s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family: var(--body-font);
      color: var(--dark);
      background: var(--ivory);
      line-height: 1.7;
      overflow-x: hidden;
    }

    img {
      width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    section {
      position: relative;
    }

    .container {
      width: min(92%, var(--container));
      margin-inline: auto;
    }

    .section {
      padding: 110px 0;
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 55px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .eyebrow::before {
      content: "";
      width: 35px;
      height: 1px;
      background: var(--brown);
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--heading-font);
      line-height: 1.15;
      font-weight: 600;
    }

    h2 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: -0.03em;
    }

    p {
      color: #665f58;
    }

    /* =========================================================
       PRELOADER
       ========================================================= */

    .preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--dark);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-content {
      text-align: center;
      color: var(--white);
    }

    .loader-logo {
      font-family: var(--heading-font);
      font-size: 2rem;
      letter-spacing: 0.08em;
    }

    .loader-line {
      width: 90px;
      height: 1px;
      background: rgba(255,255,255,0.35);
      margin: 20px auto 0;
      overflow: hidden;
    }

    .loader-line::after {
      content: "";
      display: block;
      width: 50%;
      height: 100%;
      background: var(--beige);
      animation: loader 1s infinite ease-in-out;
    }

    @keyframes loader {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* =========================================================
       NAVBAR
       ========================================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      color: var(--white);
      padding: 24px 0;
      transition:
        background var(--transition),
        padding var(--transition),
        box-shadow var(--transition);
    }

    .navbar.scrolled {
      background: rgba(39, 35, 31, 0.95);
      backdrop-filter: blur(12px);
      padding: 13px 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-family: var(--heading-font);
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .logo span {
      display: block;
      font-family: var(--body-font);
      font-size: 0.54rem;
      letter-spacing: 0.27em;
      margin-top: -3px;
      opacity: 0.75;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 35px;
      list-style: none;
    }

    .nav-links a {
      position: relative;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0.9;
      transition: opacity var(--transition);
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: var(--white);
      transition: width var(--transition);
    }

    .nav-links a:hover {
      opacity: 1;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-call {
      border: 1px solid rgba(255,255,255,0.45);
      padding: 10px 18px;
      border-radius: 100px;
      transition: all var(--transition);
    }

    .nav-call:hover {
      background: var(--white);
      color: var(--dark);
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      background: transparent;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .menu-toggle span {
      width: 18px;
      height: 1px;
      background: currentColor;
      transition: transform var(--transition);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      color: var(--white);
      background:
        linear-gradient(
          90deg,
          rgba(27,24,21,0.78) 0%,
          rgba(27,24,21,0.48) 48%,
          rgba(27,24,21,0.18) 100%
        ),
        url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=2200&q=85")
        center/cover no-repeat;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.15),
          transparent 30%,
          rgba(0,0,0,0.2)
        );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 760px;
      padding-top: 70px;
    }

    .hero-kicker {
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 22px;
      opacity: 0;
      animation: reveal 0.9s 0.2s forwards;
    }

    .hero h1 {
      font-size: clamp(3.2rem, 8vw, 6.8rem);
      letter-spacing: -0.045em;
      margin-bottom: 25px;
      opacity: 0;
      animation: reveal 0.9s 0.35s forwards;
    }

    .hero p {
      color: rgba(255,255,255,0.88);
      max-width: 630px;
      font-size: 1.05rem;
      margin-bottom: 35px;
      opacity: 0;
      animation: reveal 0.9s 0.5s forwards;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      opacity: 0;
      animation: reveal 0.9s 0.65s forwards;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 0 25px;
      border-radius: 100px;
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 700;
      transition:
        transform var(--transition),
        background var(--transition),
        color var(--transition),
        border-color var(--transition);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: var(--white);
      color: var(--dark);
    }

    .btn-primary:hover {
      background: var(--cream);
    }

    .btn-outline {
      border-color: rgba(255,255,255,0.55);
      color: var(--white);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(5px);
    }

    .btn-outline:hover {
      background: var(--white);
      color: var(--dark);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .scroll-line {
      width: 1px;
      height: 45px;
      background: rgba(255,255,255,0.7);
      animation: scrollLine 1.8s infinite;
    }

    @keyframes scrollLine {
      0%,100% {
        transform: scaleY(0.3);
        transform-origin: top;
      }
      50% {
        transform: scaleY(1);
        transform-origin: top;
      }
    }

    /* =========================================================
       ABOUT
       ========================================================= */

    .about {
      background: var(--ivory);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 85px;
      align-items: center;
    }

    .about-image {
      position: relative;
      padding-right: 35px;
      padding-bottom: 35px;
    }

    .about-image img {
      height: 620px;
      object-fit: cover;
      border-radius: 5px;
      box-shadow: var(--shadow);
      transition: transform 0.7s ease;
    }

    .about-image:hover img {
      transform: scale(1.015);
    }

    .about-image::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 55%;
      height: 45%;
      border: 1px solid var(--beige);
      z-index: -1;
    }

    .about-text p {
      margin-bottom: 20px;
    }

    .about-highlight {
      margin-top: 35px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-family: var(--heading-font);
      font-size: 1.4rem;
      color: var(--brown);
    }

    /* =========================================================
       SERVICES
       ========================================================= */

    .services {
      background: #eee9e0;
    }

    .services-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 30px;
    }

    .services-heading p {
      max-width: 420px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .service-card {
      background: var(--ivory);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-small);
      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow);
    }

    .service-image {
      height: 270px;
      overflow: hidden;
    }

    .service-image img {
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .service-card:hover .service-image img {
      transform: scale(1.07);
    }

    .service-content {
      padding: 25px;
    }

    .service-number {
      color: var(--taupe);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    .service-content h3 {
      font-size: 1.55rem;
      margin: 7px 0 10px;
    }

    .service-content p {
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .service-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--brown);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .service-link span {
      transition: transform var(--transition);
    }

    .service-link:hover span {
      transform: translateX(5px);
    }

    /* =========================================================
       SHOWCASE
       ========================================================= */

    .showcase {
      background: var(--dark);
      color: var(--white);
      overflow: hidden;
    }

    .showcase .section-heading p {
      color: rgba(255,255,255,0.62);
    }

    .showcase-layout {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      gap: 70px;
      align-items: center;
    }

    .showcase-tabs {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .showcase-tab {
      background: transparent;
      color: rgba(255,255,255,0.45);
      border: 0;
      text-align: left;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      font-family: var(--heading-font);
      font-size: clamp(1.3rem, 3vw, 2rem);
      transition: color var(--transition), padding-left var(--transition);
    }

    .showcase-tab.active,
    .showcase-tab:hover {
      color: var(--white);
      padding-left: 12px;
    }

    .showcase-visual {
      position: relative;
      min-height: 570px;
      border-radius: 5px;
      overflow: hidden;
    }

    .showcase-visual img {
      position: absolute;
      inset: 0;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.05);
      transition:
        opacity 0.6s ease,
        transform 0.9s ease;
    }

    .showcase-visual img.active {
      opacity: 1;
      transform: scale(1);
    }

    .showcase-caption {
      position: absolute;
      left: 25px;
      bottom: 25px;
      max-width: 380px;
      padding: 20px 23px;
      background: rgba(39,35,31,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 10px;
    }

    .showcase-caption h3 {
      font-size: 1.7rem;
      margin-bottom: 5px;
    }

    .showcase-caption p {
      color: rgba(255,255,255,0.75);
      font-size: 0.85rem;
    }

    /* =========================================================
       GALLERY
       ========================================================= */

    .gallery {
      background: var(--ivory);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 230px;
      gap: 14px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border-radius: 10px;
    }

    .gallery-item:nth-child(1) {
      grid-column: span 5;
      grid-row: span 2;
    }

    .gallery-item:nth-child(2) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(3) {
      grid-column: span 3;
    }

    .gallery-item:nth-child(4) {
      grid-column: span 3;
    }

    .gallery-item:nth-child(5) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(6) {
      grid-column: span 5;
      grid-row: span 2;
    }

    .gallery-item:nth-child(7) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(8) {
      grid-column: span 3;
    }

    .gallery-item img {
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: end;
      padding: 22px;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.65),
        transparent 60%
      );
      opacity: 0;
      transition: opacity var(--transition);
    }

    .gallery-overlay span {
      color: white;
      font-family: var(--heading-font);
      font-size: 1.35rem;
      transform: translateY(12px);
      transition: transform var(--transition);
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    .gallery-item:hover .gallery-overlay span {
      transform: translateY(0);
    }

    /* =========================================================
       WHY CHOOSE
       ========================================================= */

    .why {
      background: #eee9e0;
    }

    .why-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 90px;
      align-items: center;
    }

    .why-image {
      min-height: 600px;
      overflow: hidden;
      border-radius: 5px;
    }

    .why-image img {
      height: 600px;
      object-fit: cover;
      transition: transform 0.9s ease;
    }

    .why-image:hover img {
      transform: scale(1.035);
    }

    .benefits {
      display: grid;
      gap: 15px;
    }

    .benefit {
      padding: 25px 0;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 15px;
    }

    .benefit:first-child {
      border-top: 1px solid var(--border);
    }

    .benefit-icon {
      width: 42px;
      height: 42px;
      border: 1px solid var(--taupe);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brown);
      font-size: 0.85rem;
    }

    .benefit h3 {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }

    .benefit p {
      font-size: 0.88rem;
    }

    /* =========================================================
       CONTACT
       ========================================================= */

    .contact {
      color: var(--white);
      background:
        linear-gradient(
          90deg,
          rgba(32,29,26,0.96),
          rgba(32,29,26,0.75)
        ),
        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2200&q=85")
        center/cover fixed;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      gap: 90px;
      align-items: center;
    }

    .contact .eyebrow {
      color: var(--beige);
    }

    .contact .eyebrow::before {
      background: var(--beige);
    }

    .contact h2 {
      font-size: clamp(2.6rem, 5vw, 5rem);
      margin-bottom: 20px;
    }

    .contact-intro {
      color: rgba(255,255,255,0.7);
      max-width: 570px;
      margin-bottom: 40px;
    }

    .contact-details {
      display: grid;
      gap: 13px;
    }

    .contact-detail {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.9);
      transition: color var(--transition);
    }

    .contact-detail:hover {
      color: white;
    }

    .contact-icon {
      width: 43px;
      height: 43px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      display: grid;
      place-items:
